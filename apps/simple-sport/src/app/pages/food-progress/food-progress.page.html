<section class="page">
    <h2>{{ 'APP.PAGES.PROGRESS.FOOD_TITLE' | translate }}</h2>
    <p class="page-lead">{{ 'APP.PAGES.PROGRESS.FOOD_DESCRIPTION' | translate }}</p>

    <mat-form-field class="range-input">
        <mat-label>{{ 'APP.PAGES.PROGRESS.DATE_RANGE' | translate }}</mat-label>
        <mat-date-range-input [rangePicker]="picker">
            <input
                matStartDate
                [ngModel]="selectedRange().start"
                (dateChange)="onStartDate($event)"
                readonly
            />
            <input
                matEndDate
                [ngModel]="selectedRange().end"
                (dateChange)="onEndDate($event)"
                readonly
            />
        </mat-date-range-input>
        <mat-datepicker-toggle
            matIconSuffix
            [for]="picker"
        ></mat-datepicker-toggle>
        <mat-date-range-picker
            #picker
            [touchUi]="true"
            panelClass="fullscreen-date-range-picker"
        ></mat-date-range-picker>
    </mat-form-field>

    <h3 class="section-label">{{ 'APP.PAGES.PROGRESS.CALORIES_CHART' | translate }}</h3>
    <div
        #caloriesChartContainer
        class="progress-chart"
        [attr.aria-label]="'APP.PAGES.PROGRESS.CHART_ARIA' | translate"
    ></div>
</section>
