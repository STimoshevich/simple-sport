<mat-dialog-content>{{ 'APP.SETTINGS.CLEAR_DATA_CONFIRM' | translate }}</mat-dialog-content>
<mat-dialog-actions align="end">
    <button
        mat-button
        type="button"
        (click)="close(false)"
    >
        {{ 'APP.PAGES.WORKOUT_DETAIL.CANCEL' | translate }}

        mat-flat-button

        type="button"
        (click)="close(true)"
    >

    </button>
</mat-dialog-actions>
