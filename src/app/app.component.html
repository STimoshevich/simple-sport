<div class="layout">
  <mat-drawer-container class="drawer-container">
    <mat-drawer #settingsDrawer position="end" mode="over">
      <div class="drawer-content">
        <button mat-stroked-button (click)="openLanguagePopup()">{{ 'APP.SETTINGS.LANGUAGE' | translate }}</button>
        <button mat-stroked-button (click)="openThemePopup()">{{ 'APP.SETTINGS.THEME' | translate }}</button>
      </div>
    </mat-drawer>

  <aside class="side-menu">
    <div class="menu-header">
      <div class="logo-wrap">
        <button mat-icon-button type="button" (click)="settingsDrawer.toggle()" aria-label="menu">
          <mat-icon>menu</mat-icon>
        </button>
        <h1 class="logo">{{ 'APP.TITLE' | translate }}</h1>
      </div>
      <div class="header-actions">
      </div>
    </div>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel">
      <a mat-tab-link routerLink="/progress" routerLinkActive #rlaProgress="routerLinkActive" [active]="rlaProgress.isActive">{{ 'APP.MENU.PROGRESS' | translate }}</a>
      <a mat-tab-link routerLink="/history" routerLinkActive #rlaHistory="routerLinkActive" [active]="rlaHistory.isActive">{{ 'APP.MENU.HISTORY' | translate }}</a>
    </nav>
    <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
  </mat-drawer-container>
</div>
