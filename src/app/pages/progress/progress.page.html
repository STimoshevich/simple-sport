<section class="page">
  <h2>{{ 'APP.PAGES.PROGRESS.TITLE' | translate }}</h2>
  <p>{{ 'APP.PAGES.PROGRESS.DESCRIPTION' | translate }}</p>

  @if (names.length) {
  <ul class="name-list">
    @for (name of names; track name) {
      <li>
        <a [routerLink]="['/progress', name]">{{ name }}</a>
      </li>
    }
  </ul>
  } @else {
    <p>{{ 'APP.PAGES.PROGRESS.EMPTY_NAMES' | translate }}</p>
  }
</section>
