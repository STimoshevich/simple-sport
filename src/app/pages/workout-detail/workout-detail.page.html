<section class="page">
  <h2>{{ 'APP.PAGES.WORKOUT_DETAIL.TITLE' | translate }}</h2>
  <p>{{ 'APP.PAGES.WORKOUT_DETAIL.DESCRIPTION' | translate }}</p>

  <mat-card class="exercise-card" *ngFor="let workout of workouts">
    <mat-form-field appearance="outline">
      <mat-label>Exercise</mat-label>
      <mat-select [(ngModel)]="workout.name" (ngModelChange)="onNameChange(workout)">
        <mat-option *ngFor="let name of availableNames" [value]="name">{{ name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Weight</mat-label>
      <input matInput type="number" [(ngModel)]="workout.weeight" (ngModelChange)="onMetricsChange(workout)" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Reps</mat-label>
      <input matInput type="number" [(ngModel)]="workout.reps_count" (ngModelChange)="onMetricsChange(workout)" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Planned weight</mat-label>
      <input matInput type="number" [(ngModel)]="workout.plannedWeight" (ngModelChange)="onMetricsChange(workout)" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Planned reps</mat-label>
      <input matInput type="number" [(ngModel)]="workout.plannedRepls" (ngModelChange)="onMetricsChange(workout)" />
    </mat-form-field>

    <small class="error" *ngIf="validationErrorById[workout.id]">
      {{ 'APP.PAGES.WORKOUT_DETAIL.VALIDATION' | translate }}
    </small>
  </mat-card>
</section>
